[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtty"
version = "0.1.2"
description = "Private, local-first voice dictation for Linux and Windows — press Alt+D, speak, and your words are typed into any focused app."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Dainty" }]
keywords = [
    "dictation", "speech-to-text", "voice", "whisper", "faster-whisper",
    "stt", "accessibility", "offline", "privacy", "wayland",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Adaptive Technologies",
]

dependencies = [
    "faster-whisper>=1.0.0",
    "numpy",
    "pyaudio>=0.2.14",
    "webrtcvad>=2.0.10",
    # webrtcvad does `import pkg_resources` at module level, which ships with
    # setuptools — and Python 3.12+ no longer puts setuptools in a fresh venv,
    # so without this a clean `pip install voxtty` imports and dies. Capped
    # below 81 because pkg_resources is deprecated there and slated for removal.
    "setuptools<81",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "platformdirs>=4.0.0",
    "evdev>=1.6.0; sys_platform == 'linux'",
    "pynput>=1.7.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Opt-in AI cleanup pass. The app imports anthropic lazily and falls back to
# raw text when it is missing, so this is genuinely optional.
cleanup = ["anthropic>=0.40.0"]

# The wake word is deliberately NOT an extra: openwakeword depends on
# tflite-runtime, which has no wheel coverage on current Python. Install it
# by hand if you want it:
#   pip install --no-deps openwakeword>=0.6.0
#   pip install onnxruntime scipy scikit-learn requests tqdm

[project.urls]
Homepage = "https://voxtty.com"
Source = "https://github.com/PominausGH/voxtty"
Issues = "https://github.com/PominausGH/voxtty/issues"

[project.scripts]
voxtty = "voxtty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
